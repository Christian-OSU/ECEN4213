

<html>
  <head>
    <!-- define your title  -->
    <title>ECEN4213 IOT</title>
    <style>
		body {
			text-align: center;
		}
    </style>
  </head>

  <body>

      <!-- image display module -->
      <h1>Live Streaming</h1>
      <img src="../static/img name.png" height="35%">

      <hr>

      <!-- sensor status display module -->
      <div>
        <!-- module 2 sensor tag: Bumper, wheelDrop, Cilff -->	
        <!-- sensor tag: Bumper, wheelDrop, Cilff -->
        <input style="font-size:25;height:100; width:150;" type = "button" id = "bumpbutton" value = "Bumper" />
        <!-- add two more buttons here -->
        <input style="font-size:25;height:100; width:150;" type = "button" id = "dropbutton" value = "WheelDrop" />
        <input style="font-size:25;height:100; width:150;" type = "button" id = "cliffbutton" value = "Cliff" />

      </div>

      <div>
        <!-- module 2 sensor status: on, off,… -->
        <input style="font-size:25;height:100; width:150;" type = "button" id = "bumpstatus" value = "OFF" />
        <input style="font-size:25;height:100; width:150;" type = "button" id = "dropstatus" value = "OFF" />
        <input style="font-size:25;height:100; width:150;" type = "button" id = "cliffstatus" value = "OFF" />
        <!-- add two more buttons here -->
      </div>
        


      <!-- D-pad module -->
      <div>
          <div>
            <!-- up button -->
          <input style="font-size:25;height:100px; width:100px;" type = "button" id = "upbutton" value = "Up" />
          
          </div>
          
          <div>
            <!-- left, stop and right button -->
          <input style="font-size:25;height:100px; width:100px;" type = "button" id = "leftbutton" value = "Left" />
          <!-- add two more buttons here --> 
          <input style="font-size:25;height:100px; width:100px;" type = "button" id = "stopbutton" value = "Stop" />
          <input style="font-size:25;height:100px; width:100px;" type = "button" id = "rightbutton" value = "Right" />
          </div>
          
          <div>
          <!-- down button -->
          <input style="font-size:25;height:100px; width:100px;" type = "button" id = "downbutton" value = "Down" />
          </div>
      </div>

  </body>
</html>
